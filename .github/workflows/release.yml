name: release

# Pushing a tag like v0.2.0 builds a Release per platform (a Release cannot be
# cross-compiled, so each runs on its own platform) and, only if all four build,
# publishes them in one GitHub Release. Install with:
#   mise use -g github:favetelinguis/jarvis
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Version from the tag
        run: echo "JARVIS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: mix local.hex --force && mix local.rebar --force
      - name: Fetch dependencies (hex.pm is sometimes flaky)
        run: |
          for i in 1 2 3 4 5; do mix deps.get --only prod && exit 0; sleep $((i * 15)); done
          exit 1
      - run: bin/fetch-mdex-nif
      - run: mix assets.setup && mix assets.deploy
      - run: mix release --overwrite
      - name: Archive
        run: |
          name="jarvis-${JARVIS_VERSION}-${{ matrix.target }}"
          tar -C _build/prod/rel/jarvis -czf "${name}.tar.gz" .
          echo "ARCHIVE=${name}.tar.gz" >> "$GITHUB_ENV"
      - name: The archive runs
        run: |
          mkdir smoke && tar -C smoke -xzf "$ARCHIVE"
          test "$(JARVIS_DATA_DIR=$PWD/smoke-data smoke/bin/jarvis version)" = "$JARVIS_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
