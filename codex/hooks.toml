# Mirror every Codex session into Jarvis. Append to ~/.codex/config.toml.
#
# Codex passes the hook a JSON object on stdin with session_id,
# transcript_path, cwd, and hook_event_name; Jarvis reads the rollout file
# itself, so the hook only forwards that object. It never fails the turn:
# if Jarvis is down, the next hook catches up from where the last one ended.

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "curl -fsS -m 5 -H 'content-type: application/json' --data-binary @- \"${JARVIS_URL:-http://localhost:4000}/api/transcripts/sync?harness=codex\" >/dev/null 2>&1 || true"
timeout = 10

[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = "curl -fsS -m 5 -H 'content-type: application/json' --data-binary @- \"${JARVIS_URL:-http://localhost:4000}/api/transcripts/sync?harness=codex\" >/dev/null 2>&1 || true"
timeout = 10
