[tools]
erlang = "29.1.2"
elixir = "1.20.4-otp-29"

[tasks.db]
description = "Start PostgreSQL in Docker and wait until it accepts connections"
run = "docker compose up -d --wait"

[tasks.setup]
description = "First-time setup: database, dependencies, MDEx NIF, assets, migrations"
depends = ["db"]
run = ["mix deps.get", "bin/fetch-mdex-nif", "mix setup"]

[tasks.server]
description = "Run the long-lived Jarvis server on http://localhost:4000"
depends = ["db"]
run = "mix ecto.migrate && mix phx.server"

[tasks.check]
description = "Format, compile without warnings, and run the tests"
depends = ["db"]
run = "mix precommit"
