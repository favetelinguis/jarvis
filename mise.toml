[tools]
erlang = "29.1.2"
elixir = "1.20.4-otp-29"

[tasks.setup]
description = "First-time setup: dependencies, MDEx NIF, assets, migrations"
run = ["mix deps.get", "bin/fetch-mdex-nif", "mix setup"]

[tasks.server]
description = "Run the long-lived Jarvis server on http://localhost:4000"
run = "mix ecto.migrate && mix phx.server"

[tasks.check]
description = "Format, compile without warnings, and run the tests"
run = "mix precommit"
